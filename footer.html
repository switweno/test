<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<title>Slider بالأوامر الصوتية</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css"/>
<style>
body {
background: #111;
margin: 0;
font-family: sans-serif;
color: #fff;
text-align: center;
}
.swiper {
width: 90%;
max-width: 800px;
height: 400px;
margin: 40px auto;
border-radius: 15px;
overflow: hidden;
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}
.swiper-slide img {
width: 100%;
height: 100%;
object-fit: cover;
}
.status {
margin-top: 20px;
font-size: 20px;
color: #0f0;
}
</style>
</head>
<body>
<h1>🗣️ سلايدر يتحكم بالصوت</h1>
<div class="swiper">
<div class="swiper-wrapper">
<div class="swiper-slide"><img src="images/slider/likebike-shine-s-01.webp" /></div>
<div class="swiper-slide"><img src="images/slider/likebike-shine-s-02.webp" /></div>
<div class="swiper-slide"><img src="images/slider/likebike-shine-s-03.webp" /></div>
</div>
<div class="swiper-pagination"></div>
</div>
<div class="status" id="status">🎤 كنستناك تقول: "يمين" أو "يسار"</div>
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
<script>
const swiper = new Swiper('.swiper', {
loop: true,
pagination: {
el: '.swiper-pagination',
clickable: true,
},
});
const statusText = document.getElementById('status');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
statusText.textContent = "🚫 المتصفح ديالك ما كيدعمش Web Speech API";
} else {
const recognition = new SpeechRecognition();
recognition.lang = 'ar-MA';
recognition.continuous = false;
recognition.interimResults = false;
recognition.onstart = () => {
statusText.textContent = "🎧 كنصنت ليك... قول 'يمين' أو 'يسار'";
};
recognition.onresult = event => {
const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
console.log('📢 سمع:', transcript);
if (transcript.includes("يمين")) {
swiper.slidePrev();
statusText.textContent = "⬅️ يمين - تبدل السلايد";
} else if (transcript.includes("يسار")) {
swiper.slideNext();
statusText.textContent = "➡️ يسار - تبدل السلايد";
} else {
statusText.textContent = `🔊 سمع: "${transcript}" (ماشي أمر معروف)`;
}
};
recognition.onerror = event => {
statusText.textContent = `❌ خطأ: ${event.error}`;
};
recognition.onend = () => {
recognition.start(); // هنا كيرجع يستمع مباشرة
};
recognition.start(); // أول مرة
}
</script>
</body>
</html>
